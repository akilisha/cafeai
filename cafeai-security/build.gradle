// ============================================================
//  cafeai-security
//  AI-specific security layer — beyond traditional guardrails.
//  Covers: an audit trail for blocked prompt injection -- typed
//  security events with a unique id, delivered to your listener.
//  This is a middleware layer. Everything is composable.
// ============================================================

description = 'AI security layer for CafeAI — blocks prompt injection and raises typed, ' +
    'auditable security events.'

apply from: "$rootDir/gradle/maven-central.gradle"

dependencies {

    api project(':cafeai-core')
    api project(':cafeai-guardrails')
}
