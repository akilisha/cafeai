// ============================================================
//  cafeai-bom
//  Bill of materials: one version for every published CafeAI module.
//
//  A user adds it once and declares the modules without versions:
//
//      implementation platform("com.akilisha.oss:cafeai-bom:0.4.0")
//      implementation "com.akilisha.oss:cafeai-core"
//      implementation "com.akilisha.oss:cafeai-guardrails"
//
//  The modules are released together and share service-loader interfaces, so a
//  mix of versions is not a supported combination; this keeps them aligned.
//
//  The members are the modules that publish (they apply
//  gradle/maven-central.gradle). A module that starts publishing joins the BOM
//  by doing so; cafeai-examples and the capstones never do. Third-party versions
//  are deliberately not here: LangChain4j and Helidon keep their own BOMs, which
//  the module POMs already import.
// ============================================================

plugins {
    id 'java-platform'
}

description = 'Bill of materials for CafeAI: aligns every published CafeAI module on one version.'

// The other projects must be evaluated first, so that "does it publish?" can be asked of them.
rootProject.subprojects.each { other ->
    if (other != project) {
        evaluationDependsOn(other.path)
    }
}

def published = rootProject.subprojects.findAll { other ->
    other != project && other.pluginManager.hasPlugin('com.vanniktech.maven.publish')
}

dependencies {
    constraints {
        published.each { module ->
            api module
        }
    }
}

apply from: "$rootDir/gradle/maven-central.gradle"
