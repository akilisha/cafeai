// ============================================================
//  cafeai-loop
//  The development loop (docs/DEV_LOOP_VISION.md),
//  made runnable: init, design, plan, brew, run and review, each
//  an agent working on a project's living artifacts.
//
//  Design spec: DESIGN_SPEC.md, beside this file; its plan is
//  docs/roadmap/. The module is built with the loop it implements.
//
//  From source, the whole `cafeai` command (the loop's commands,
//  and login, logout and status from cafeai-cli):
//    ./gradlew :cafeai-loop:install
//
//  Not published, not in the BOM: nothing in the framework depends
//  on it, so it can move to a repository of its own later.
// ============================================================

description = 'The CafeAI development loop: init, design, plan, brew, run, review.'

dependencies {
    implementation project(':cafeai-cli')
    implementation project(':cafeai-core')
    implementation project(':cafeai-aiservices')   // the agents behind app.agent(...)
    implementation project(':cafeai-guardrails')
    implementation project(':cafeai-observability')
    // cafeai-loop.yaml, the dials (DESIGN_SPEC.md, The dials). Already shipped at runtime, same version.
    implementation "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:${rootProject.ext.jacksonVersion}"
    runtimeOnly "org.slf4j:slf4j-nop:${rootProject.ext.slf4jVersion}"

    testImplementation project(':cafeai-test')
}

// The command's name, JVM options and `install`: gradle/cafeai-command.gradle.
apply from: "$rootDir/gradle/cafeai-command.gradle"

application {
    mainClass = 'io.cafeai.loop.Loop'
}

// The evals (ROADMAP-03, phase 5): init and plan on Spring PetClinic, measured against the run by
// hand. Their own source set and task, never part of `check`: they need PetClinic, and a live run
// costs money.
//   ./gradlew :cafeai-loop:eval -Peval.petclinic=<clone>                  replays the recordings: no key, no cost
//   ./gradlew :cafeai-loop:eval -Peval.mode=record -Peval.model=anthropic:<model-id> -Peval.petclinic=<clone>
//                                                                         calls the model, live, and records it
// Recordings stay on this machine (~/.cafeai/loop/evals/<model>/); what each run produced, its
// conversation and its report go to build/evals/<model>/.
sourceSets {
    eval {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    evalImplementation.extendsFrom testImplementation
    evalRuntimeOnly.extendsFrom testRuntimeOnly
}
dependencies {
    evalImplementation project(':cafeai-test')
}
tasks.register('eval', Test) {
    description = 'Evals of init and plan on Spring PetClinic (-Peval.mode, -Peval.model, -Peval.petclinic).'
    group = 'verification'
    testClassesDirs = sourceSets.eval.output.classesDirs
    classpath = sourceSets.eval.runtimeClasspath
    useJUnitPlatform()
    ['eval.mode', 'eval.model', 'eval.judge', 'eval.developer', 'eval.petclinic', 'eval.cassettes'].each { key ->
        if (project.hasProperty(key)) systemProperty key, project.property(key)
    }
    systemProperty 'eval.out', layout.buildDirectory.dir('evals').get().asFile.absolutePath
    outputs.upToDateWhen { false }
    testLogging { events 'passed', 'skipped', 'failed'; showStandardStreams = true; exceptionFormat = 'full' }
}

// The prompts are versioned with CafeAI: the build writes its version beside them (Prompts.version()).
processResources {
    inputs.property('version', project.version)
    filesMatching('io/cafeai/loop/version.properties') { expand(version: project.version) }
}
