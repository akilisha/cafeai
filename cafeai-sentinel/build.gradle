// ============================================================
//  cafeai-sentinel
//  AI cluster incident pipeline.
//
//  Watches a Kubernetes / OpenShift cluster via fabric8 informers,
//  triages pod events, runs an agentic investigation against the
//  live cluster on confirmed failures (read-only tools), and emits
//  a structured incident to a pluggable IncidentSink.
//
//  A pipeline, not a product — it ends at "incident published".
//  Runnable companion: capstones/cluster-sentinel.
//
//  See docs/roadmap/ROADMAP-18-sentinel.md.
// ============================================================

description = 'AI cluster incident pipeline — watch a Kubernetes/OpenShift cluster, ' +
    'triage and investigate pod failures with the cafeai AI primitives, emit a structured incident.'

// NOT published yet — Maven Central opt-in lands at ROADMAP-18 Phase 7 (0.3.0),
// gated on the OpenShift portability validation (Phase 6). Until then the module
// is reactor-only: it keeps the framework honest without shipping an empty shell.
// apply from: "$rootDir/gradle/maven-central.gradle"

dependencies {

    api project(':cafeai-core')
    api project(':cafeai-agents')

    // PiiGuardRail.scrub — redact secrets/PII from cluster text before it reaches
    // the prompt or the incident (ROADMAP-18 Phase 4). Not exposed in the API.
    implementation project(':cafeai-guardrails')

    // Incident -> JSON for the webhook and SSE sinks (ROADMAP-18 Phase 5).
    implementation "com.fasterxml.jackson.core:jackson-databind:${rootProject.ext.jacksonVersion}"

    // fabric8 KubernetesClient leaks through ClusterWatch / (later) KubeTools.
    // openshift-client is a superset of kubernetes-client — OpenShiftClient
    // extends KubernetesClient, so the OpenShift target costs nothing extra.
    //
    // Swap the default okhttp 3.12 backend for the JDK HttpClient one — we are
    // on Java 23 and have no reason to carry a 2018-era okhttp.
    api("io.fabric8:openshift-client:${rootProject.ext.fabric8Version}") {
        exclude group: 'io.fabric8', module: 'kubernetes-httpclient-okhttp'
    }
    runtimeOnly "io.fabric8:kubernetes-httpclient-jdk:${rootProject.ext.fabric8Version}"
}
