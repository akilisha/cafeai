// ============================================================
//  cafeai-cli
//  The `cafeai` command: `cafeai login <vendor>`, `cafeai logout`,
//  `cafeai status` (docs/design/LOGIN.md).
//
//  From source, onto ~/.cafeai/cli (put ~/.cafeai/cli/bin on the PATH):
//    ./gradlew :cafeai-cli:install
//
//  Published, so the JBang catalog's `cafeai` alias can depend on
//  it (distribution.md step 6). Apps don't depend on it: what a
//  provider reads (saved keys, the Claude sign-in, the cloud CLI
//  sign-ins) is in cafeai-core.
// ============================================================

description = 'The cafeai command: sign in to a model once.'

apply from: "$rootDir/gradle/maven-central.gradle"

dependencies {
    implementation project(':cafeai-core')
    runtimeOnly "org.slf4j:slf4j-nop:${rootProject.ext.slf4jVersion}"
}

// The command's name, JVM options and `install`: gradle/cafeai-command.gradle.
apply from: "$rootDir/gradle/cafeai-command.gradle"

application {
    mainClass = 'io.cafeai.cli.CafeLogin'
}
