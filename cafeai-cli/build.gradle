// ============================================================
//  cafeai-cli
//  The `cafeai` command: `cafeai login <vendor>`, `cafeai logout`,
//  `cafeai status` (docs/design/LOGIN.md).
//
//  From source, onto ~/.cafeai/cli (put ~/.cafeai/cli/bin on the PATH):
//    ./gradlew :cafeai-cli:install
//
//  Not published yet; released versions will come through the JBang
//  catalog (distribution.md step 6).
// ============================================================

plugins {
    id 'application'
}

description = 'The cafeai command: sign in to a model once.'

dependencies {
    implementation project(':cafeai-core')
    runtimeOnly "org.slf4j:slf4j-nop:${rootProject.ext.slf4jVersion}"
}

application {
    applicationName = 'cafeai'
    mainClass = 'io.cafeai.core.login.CafeLogin'
}

// An install from source runs on the JDK it was built with, whatever JAVA_HOME says
// (CAFEAI_JAVA_HOME overrides). The shipped scripts (installDist, distZip) are left as they are.
def builtWith = javaToolchains.launcherFor(java.toolchain).map { it.metadata.installationPath.asFile.absolutePath }

tasks.register('install', Sync) {
    group = 'distribution'
    description = 'Installs the cafeai command into ~/.cafeai/cli (bin/ goes on the PATH).'
    from tasks.named('installDist')
    into "${System.getProperty('user.home')}/.cafeai/cli"
    def jdk = builtWith.get()
    inputs.property('jdk', jdk)
    filesMatching('bin/cafeai') {
        filter { line -> line.startsWith('if [ -n "$JAVA_HOME" ]')
                ? "JAVA_HOME=\${CAFEAI_JAVA_HOME:-'${jdk.replace('\\', '/')}'}\n" + line : line }
    }
    filesMatching('bin/cafeai.bat') {
        filter { line -> line == 'if defined JAVA_HOME goto findJavaFromJavaHome'
                ? "set JAVA_HOME=${jdk}\r\nif defined CAFEAI_JAVA_HOME set JAVA_HOME=%CAFEAI_JAVA_HOME%\r\n" + line : line }
    }
    doLast { println "cafeai installed: ${destinationDir}${File.separator}bin" }
}
