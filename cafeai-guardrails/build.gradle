// ============================================================
//  cafeai-guardrails
//  Safety and regulatory guardrails for CafeAI.
//  Pre-LLM and post-LLM middleware layers.
//  Covers: PII scrubbing, jailbreak and prompt-injection
//  detection, toxicity filtering, topic boundaries, and
//  regulatory compliance (GDPR, HIPAA, FCRA, CCPA, ECOA,
//  fair housing). All pattern-based; no ML model is bundled.
// ============================================================

description = 'Safety and regulatory guardrails for CafeAI — PII scrubbing, jailbreak and ' +
    'prompt-injection detection, toxicity filtering, topic boundaries, and regulatory compliance.'

apply from: "$rootDir/gradle/maven-central.gradle"

dependencies {

    api project(':cafeai-core')
}
