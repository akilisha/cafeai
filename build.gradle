// ============================================================
//  CafeAI - Root Build Configuration
//  Groovy DSL | Java 23+ | Helidon SE | Langchain4j
// ============================================================

plugins {
    // Publishing to Maven Central via the Sonatype Central Portal.
    // Put on the classpath here; each module that ships opts in with
    //   apply from: "$rootDir/gradle/maven-central.gradle"
    // 0.37.x requires Gradle 9.0+ (see gradle/wrapper — pinned to 9.7.x).
    id 'com.vanniktech.maven.publish' version '0.37.0' apply false
}

// ── Version Catalog ─────────────────────────────────────────
ext {
    javaVersion             = 23
    helidonVersion          = '4.5.5'
    langchain4jVersion      = '1.20.0'
    chronicleMapVersion     = '3.25ea0'
    opentelemetryVersion    = '1.40.0'
    jacksonVersion          = '2.22.2'
    lettuceVersion          = '6.3.2.RELEASE'
    hikariVersion           = '5.1.0'
    postgresqlVersion       = '42.7.13'
    fabric8Version          = '6.13.4'   // ROADMAP-18 cafeai-sentinel; pin verified when P1 lands
    junitVersion            = '5.14.4'
    assertjVersion          = '3.27.7'
    mockitoVersion          = '5.23.0'
    testcontainersVersion   = '1.20.2'
    slf4jVersion            = '2.0.19'
    logbackVersion          = '1.5.38'
}

// ── Shared Config for All Subprojects ───────────────────────
subprojects {
    apply plugin: 'java-library'

    group   = 'com.akilisha.oss'
    version = '0.4.0'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(rootProject.ext.javaVersion)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << '-parameters'
    }

    // Stamps the real project version into every module's JAR manifest — the
    // Java equivalent of reading package.json at runtime. CafeAIModule.versionOf()
    // reads this back via Package.getImplementationVersion(), so no
    // implementation ever hardcodes a version string that then rots.
    tasks.withType(Jar).configureEach {
        manifest {
            attributes(
                'Implementation-Title':   project.name,
                'Implementation-Version': project.version
            )
        }
    }

    test {
        useJUnitPlatform()
        testLogging {
            events 'passed', 'failed', 'skipped'
            showStandardStreams = false
        }
    }

    // Javadoc: our docs use em-dashes / Unicode that trip the strict
    // doclint checker on some platforms. Non-fatal for the sources we ship.
    tasks.withType(Javadoc).configureEach {
        options.addStringOption('Xdoclint:none', '-quiet')
        options.addStringOption('-release', rootProject.ext.javaVersion.toString())
        failOnError = false
    }

    repositories {
        mavenCentral()
    }

    // ── BOM Imports ─────────────────────────────────────────
    dependencies {
        implementation platform("io.helidon:helidon-bom:${rootProject.ext.helidonVersion}")
        // langchain4j types leak through the public API of cafeai-core (ChatModel,
        // AiServices) and cafeai-agents, so those modules declare langchain4j deps as
        // `api`. The BOM that versions them must be on `api` too, or the generated POM
        // publishes those dependencies with no version.
        api platform("dev.langchain4j:langchain4j-bom:${rootProject.ext.langchain4jVersion}")

        implementation "org.slf4j:slf4j-api:${rootProject.ext.slf4jVersion}"

        // logback is an SLF4J binding, not API — a library must not put one on its
        // consumers' runtime classpath. Modules get it only for their own tests;
        // runnable artifacts (cafeai-examples) declare it themselves.
        testRuntimeOnly "ch.qos.logback:logback-classic:${rootProject.ext.logbackVersion}"

        testImplementation "org.junit.jupiter:junit-jupiter:${rootProject.ext.junitVersion}"
        testImplementation "org.junit.jupiter:junit-jupiter-params:${rootProject.ext.junitVersion}"
        testRuntimeOnly    "org.junit.platform:junit-platform-launcher"
        testImplementation "org.assertj:assertj-core:${rootProject.ext.assertjVersion}"
        testImplementation "org.mockito:mockito-core:${rootProject.ext.mockitoVersion}"
        testImplementation "org.mockito:mockito-junit-jupiter:${rootProject.ext.mockitoVersion}"
    }
}
