// ============================================================
//  cafeai-agentic
//  HTTP identity for langchain4j-agentic multi-agent workflows.
//
//  CafeAI does not implement multi-agent orchestration -- LangChain4j's
//  langchain4j-agentic module owns sequence/parallel/loop/conditional/
//  supervisor composition and AgenticScope. This module writes the
//  binding: CafeAgentic.agentBuilder(app, Type) pre-wires the app's
//  registered model, guardrails, and observability into a real
//  AgenticServices.agentBuilder(Type) instance, the same job
//  cafeai-aiservices does for plain AiServices.
//
//  Independent of cafeai-aiservices -- works standalone.
// ============================================================

description = 'HTTP identity for langchain4j-agentic multi-agent workflows -- ' +
    'the app\'s model, guardrails, and observability pre-wired into every agent.'

apply from: "$rootDir/gradle/maven-central.gradle"

dependencies {

    api project(':cafeai-core')

    // AgenticServices, AgentBuilder, MonitoredAgent, InputGuardrail/OutputGuardrail,
    // ChatMemoryProvider -- consumers write langchain4j-agentic-annotated interfaces
    // (@Agent, @SequenceAgent, ...) and receive its raw builder/proxy types, so these
    // need to be on their compile classpath.
    api "dev.langchain4j:langchain4j-agentic:${rootProject.ext.langchain4jAgenticVersion}"
    api 'dev.langchain4j:langchain4j'
    api 'dev.langchain4j:langchain4j-core'

    testImplementation project(':cafeai-guardrails')
}
