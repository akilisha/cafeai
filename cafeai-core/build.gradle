// ============================================================
//  cafeai-core
//  The Express-inspired foundation of CafeAI.
//  Contains: CafeAI app bootstrap, routing, middleware chain,
//  AI primitives (ai, system, prompt, chain, guard, memory,
//  rag, tool, mcp, agent, observe), and the request/response
//  abstraction over Helidon SE.
// ============================================================

description = 'The Express-inspired foundation of CafeAI — app bootstrap, routing, ' +
    'the middleware chain, and the AI primitives over Helidon SE.'

apply from: "$rootDir/gradle/maven-central.gradle"

dependencies {

    // ── Helidon SE ───────────────────────────────────────────
    implementation 'io.helidon.webserver:helidon-webserver'
    implementation 'io.helidon.webserver:helidon-webserver-http2'
    implementation 'io.helidon.webserver:helidon-webserver-websocket'
    implementation 'io.helidon.websocket:helidon-websocket'          // WsListener, WsSession, WsCloseStatus
    implementation 'io.helidon.http:helidon-http'               // HeaderName, HeaderValues, Status
    implementation 'io.helidon.common:helidon-common'           // Parameters (path/query params)
    implementation 'io.helidon.common:helidon-common-buffers'  // BufferData (WebSocket binary)
    implementation 'io.helidon.http.media:helidon-http-media-jsonp'
    implementation 'io.helidon.http.media:helidon-http-media-jsonb'

    // ── Langchain4j Core ─────────────────────────────────────
    // `api`: these leak through the public API, so consumers need them at
    // compile time. langchain4j-core → dev.langchain4j.model.chat.ChatModel
    // (spi/AgentBridge, ai/OpenAI.toChatModel); langchain4j →
    // dev.langchain4j.service.AiServices (agents/AgentConfig) and the @Tool
    // annotation used to author agent tools.
    api 'dev.langchain4j:langchain4j-core'
    api 'dev.langchain4j:langchain4j'

    // ── LLM Providers ────────────────────────────────────────
    // OpenAI
    implementation 'dev.langchain4j:langchain4j-open-ai'
    // Anthropic Claude
    implementation 'dev.langchain4j:langchain4j-anthropic'
    // Ollama (local models via llama.cpp)
    implementation 'dev.langchain4j:langchain4j-ollama'
    // Jlama (pure-Java in-process inference — no server, no native code)
    implementation 'dev.langchain4j:langchain4j-jlama'
    // Google Gemini — NOT one of the four ProviderType values LangchainBridge's
    // switch wires up. ai/Gemini.java reaches it entirely through the public
    // LangchainBridge.ChatModelAccess escape hatch; this dependency line is the
    // only change anything in this module needed to gain a fifth provider.
    implementation 'dev.langchain4j:langchain4j-google-ai-gemini'

    // ── Serialization ────────────────────────────────────────
    // `api`: @JsonCreator/@JsonProperty annotate the public constructor and
    // accessors of memory/ConversationContext. databind + jsr310 are used only
    // in method bodies (ai/ResponseDeserializer) — they stay `implementation`.
    api            "com.fasterxml.jackson.core:jackson-annotations:${rootProject.ext.jacksonVersion}"
    implementation "com.fasterxml.jackson.core:jackson-databind:${rootProject.ext.jacksonVersion}"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:${rootProject.ext.jacksonVersion}"

    // ── Logging ──────────────────────────────────────────────
    implementation "org.slf4j:slf4j-api:${rootProject.ext.slf4jVersion}"
}

// Placeholder keys for the test JVM only. The bridge and the Gemini/Nvidia providers
// read their key from the environment when they build a model, so without these a
// test can't construct one offline. Building a model makes no network call, so nothing
// here can authenticate against anything; setting them here (not inheriting the shell's)
// also means a developer's real key can never reach a test.
tasks.named('test') {
    environment 'OPENAI_API_KEY',    'test-key-not-real'
    environment 'ANTHROPIC_API_KEY', 'test-key-not-real'
    environment 'GEMINI_API_KEY',    'test-key-not-real'
    environment 'NVIDIA_API_KEY',    'test-key-not-real'
}
